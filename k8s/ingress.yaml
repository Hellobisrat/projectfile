apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ci-demo-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: ci-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ci-demo-service
                port:
                  number: 3000

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-demo-service
                port:
                  number: 3001
